<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2563EB" />
    <meta
      name="description"
      content="RozgaarAI is a voice-first AI employment assistant for India's informal workers."
    />
    <link rel="icon" href="/favicon-32x32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>RozgaarAI</title>
    <script>
      (function () {
        try {
          var versionKey = "rozgaarai-app-cache-version";
          var version = "2026-07-18-load-fix-2";
          if (window.localStorage.getItem(versionKey) !== version) {
            [
              "rozgaarai-worker-session-v1",
              "rozgaarai-render-recovery-attempted",
              "vite-error-overlay-dismissed"
            ].forEach(function (key) {
              window.localStorage.removeItem(key);
              window.sessionStorage.removeItem(key);
            });
            window.sessionStorage.removeItem("rozgaar-demo-mode");
            window.localStorage.setItem(versionKey, version);
          }
        } catch (error) {
          console.warn("RozgaarAI startup cache check skipped", error);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <div
        style="
          min-height: 100vh;
          display: grid;
          place-items: center;
          background: #f8fafc;
          color: #0f172a;
          font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
          text-align: center;
          padding: 24px;
        "
      >
        <div>
          <img
            src="/rozgaarai-icon.png"
            alt="RozgaarAI"
            style="width: 64px; height: 64px; object-fit: contain; border-radius: 12px; margin: 0 auto 16px;"
          />
          <div style="font-size: 24px; font-weight: 900;">RozgaarAI</div>
          <div style="margin-top: 8px; font-size: 14px; font-weight: 700; color: #64748b;">Loading workspace...</div>
          <div style="margin-top: 12px; max-width: 360px; font-size: 12px; font-weight: 700; line-height: 1.6; color: #94a3b8;">
            Please wait while the workspace is prepared.
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
